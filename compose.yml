services:
  postgres:
    image: postgres:18
    container_name: logiai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - logiai_postgres_data:/var/lib/postgresql

volumes:
  logiai_postgres_data:
