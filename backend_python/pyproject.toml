[project]
name = "logiai-backend"
version = "0.1.0"
description = "AI powered logistics backend"
readme = "README.md"
authors = [
    { name = "aditya-padhi-kbl", email = "aditya.padhi@outlook.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]
[tool.mypy]
python_version = "3.14"
python_executable = ".venv/bin/python"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
